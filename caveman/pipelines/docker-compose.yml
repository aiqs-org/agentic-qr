version: "3.9"
services:
  pipelines:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pipelines
    restart: "no"
    environment:
      - SHARED_DATA_PATH=/shared/data
      - VAULT_BUS_PATH=/vault/bus
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY}
      - FRED_API_KEY=${FRED_API_KEY}
    volumes:
      - /home/gram/projects/shared:/shared:rw
      - /home/gram/projects/vault:/vault:rw
    networks:
      - agent-net
networks:
  agent-net:
    external: true
    name: agent-net
