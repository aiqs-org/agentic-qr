services:
  intake:
    build: .
    container_name: caveman-intake
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./drop:/intake/drop:ro
      - ./processed:/intake/processed:rw
      - ../shared/hypotheses:/shared/hypotheses:rw
      - ../shared/knowledge:/shared/knowledge:rw
      - ../shared/context_graph:/shared/context_graph:rw
      - ../shared/projects:/shared/projects:rw
      - ../vault/bus:/vault/bus:rw
      - ../vault/logs:/vault/logs:rw
    networks:
      - caveman-net

  discord-intake:
    build: .
    container_name: caveman-discord-intake
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "src/discord_agent.py"]
    volumes:
      - ../shared/context_graph:/shared/context_graph:rw
      - ../shared/projects:/shared/projects:rw
      - ../vault/bus:/vault/bus:rw
      - ../vault/logs:/vault/logs:rw
    networks:
      - caveman-net

networks:
  caveman-net:
    external: true
    name: caveman-net
